<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="app-base-path" id="meta-app-base" content="%%APP_BASE_PATH%%" />
    <title>Claude Web UI</title>
    <style>
      html {
        background: #0f1117;
        color: #e6edf3;
      }
      html:not(.app-ready) #app {
        visibility: hidden;
      }
    </style>
    <base id="app-base" href="%%APP_BASE_HREF%%" />
    <script>
      (function () {
        var meta = document.getElementById("meta-app-base");
        var fromServer = meta && meta.getAttribute("content");
        if (fromServer) {
          document.getElementById("app-base").href = fromServer.replace(/\/?$/, "/");
          return;
        }
        var path = location.pathname;
        if (!path.endsWith("/")) path += "/";
        document.getElementById("app-base").href = path;
      })();
    </script>
    <link rel="stylesheet" href="static/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="static/app.js"></script>
  </body>
</html>
